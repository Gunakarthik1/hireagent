<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireAgent Fill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 200px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }

    .header {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      padding: 16px 18px 14px;
      border-bottom: 1px solid #2d2d4e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo { font-size: 22px; }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #a5b4fc;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    .settings-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #a5b4fc; }

    .body { padding: 16px 18px; }

    /* Status section */
    .status-card {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon { font-size: 24px; }

    .status-text .title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .status-text .subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .field-count {
      margin-left: auto;
      background: #4ade8022;
      color: #4ade80;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #4ade8044;
    }

    .field-count.zero {
      background: #f8717122;
      color: #f87171;
      border-color: #f8717144;
    }

    /* Buttons */
    .btn-fill {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .btn-fill:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .btn-fill:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-fill.loading {
      background: linear-gradient(135deg, #334155, #1e293b);
    }

    /* Progress */
    .progress {
      margin-top: 14px;
      display: none;
    }

    .progress-bar-track {
      background: #1e293b;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #4f46e5, #4ade80);
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
      text-align: center;
    }

    /* Results */
    .result {
      margin-top: 14px;
      background: #1a1a2e;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #2d2d4e;
      display: none;
    }

    .result.success { border-color: #4ade8044; }
    .result.error { border-color: #f8717144; }

    .result-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .result.success .result-title { color: #4ade80; }
    .result.error .result-title { color: #f87171; }

    .result-body {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      padding: 10px 18px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-link {
      font-size: 11px;
      color: #64748b;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .footer-link:hover { color: #a5b4fc; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #ffffff33;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🤖</span>
    <div class="header-text">
      <h1>HireAgent Fill</h1>
      <p>AI-powered form autofill</p>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
  </div>

  <div class="body">
    <div class="status-card" id="statusCard">
      <span class="status-icon" id="statusIcon">🔍</span>
      <div class="status-text">
        <div class="title" id="statusTitle">Scanning page...</div>
        <div class="subtitle" id="statusSubtitle">Detecting form fields</div>
      </div>
      <span class="field-count zero" id="fieldCount">0</span>
    </div>

    <button class="btn-fill" id="fillBtn" disabled>
      <span id="fillBtnIcon">✨</span>
      <span id="fillBtnText">Auto-Fill Form</span>
    </button>

    <div class="progress" id="progressSection">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progressLabel">Calling AI...</div>
    </div>

    <div class="result" id="resultCard">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>

  <div class="footer">
    <button class="footer-link" id="editProfileBtn">Edit Profile</button>
    <button class="footer-link" id="rescanBtn">Rescan</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
